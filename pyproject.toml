[project]
name = "ploutos-gate"
version = "0.1.0"
description = "SEO, AEO, and GEO utility libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "praw",
    "python-dotenv",
    "deepagents",
    "langchain-anthropic",
]

[tool.setuptools.packages.find]
where = ["src/modules"]
include = ["reddit*", "seo*", "aeo*", "geo*", "llm*"]
