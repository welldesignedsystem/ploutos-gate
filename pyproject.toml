[project]
name = "ploutos-gate"
version = "0.1.0"
description = "SEO, AEO, and GEO utility libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "python-dotenv",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src/modules"]
include = ["llm*", "probe*"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src/modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
    ".venv/",
    "build/",
]
[[tool.mypy.overrides]]
module = ["mcp.*", "bs4", "lxml"]
ignore_missing_imports = true
